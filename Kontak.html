
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Get in Touch</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        background: #141414;
        font-family: Arial, sans-serif;
        color: #fff;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 25px;
    }

    .container {
        width: 100%;
        max-width: 700px;
        background: #202020;
        border: 1px solid #333;
        border-bottom: 5px solid #ff2636;
        border-radius: 12px;
        padding: 55px 25px;
        text-align: center;
    }

    h1 {
        font-size: 38px;
        font-weight: 800;
        margin-bottom: 15px;
    }

    h1 span {
        color: #ff2636;
    }

    p {
        color: #bdbdbd;
        font-size: 17px;
        line-height: 1.6;
        margin-bottom: 30px;
    }

    .button {
        display: inline-block;
        background: #ff2636;
        color: #fff;
        text-decoration: none;
        padding: 16px 38px;
        border-radius: 6px;
        font-size: 16px;
        font-weight: bold;
        transition: 0.3s ease;
    }

    .button:hover {
        background: #d91c2a;
        transform: translateY(-3px);
    }

    @media (max-width: 480px) {
        h1 {
            font-size: 29px;
        }

        p {
            font-size: 15px;
        }
    }
</style>
</head>

<body>

<div class="container">
    <h1>GET IN <span>TOUCH</span></h1>

    <p>
        Ready to level up your protection?
        Click below to get started.
    </p>

    <a href="https://docs.google.com/forms/d/e/1FAIpQLSfdk-xj2dVxYofQiY0uYFibcN5gxpEO-MW6hI6sW0C8Wi9ECw/viewform?usp=dialog"
       class="button"
       target="_blank"
       rel="noopener noreferrer">
        CONTACT US →
    </a>
</div>

</body>
</html>
